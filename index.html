<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดรายจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --page: #F2F5F7;
  --card: #FFFFFF;
  --ink: #16233A;
  --ink-2: #4A5568;
  --muted: #7C8797;
  --line: #E2E7ED;
  --key: #FFFFFF;
  --key-press: #E4EAF0;
  --green: #06C755;
  --green-ink: #047A35;
  --green-wash: #E3F8EC;
  --warn: #B87800;
  --warn-wash: #FFF4DB;
  --crit: #D03B3B;
  --crit-wash: #FDECEC;
  --bar: #2a78d6;
  --track: #E6EAEF;
  --c-food: #eb6834; --c-drink: #eda100; --c-travel: #2a78d6; --c-shopping: #e87ba4;
  --c-bills: #6250d6; --c-fun: #1baf7a; --c-health: #008300; --c-other: #898781;
  --num: "Bai Jamjuree", "Anuphan", system-ui, sans-serif;
  --ui: "Anuphan", system-ui, -apple-system, "Segoe UI", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0F151D; --card: #18212C; --ink: #EDF1F5; --ink-2: #B4BECB; --muted: #808B99;
    --line: #263241; --key: #1C2633; --key-press: #2A3644;
    --green-ink: #2BD877; --green-wash: #12301F; --warn: #F0B232; --warn-wash: #33290F;
    --crit: #EF6B6B; --crit-wash: #3A1A1A; --bar: #3987e5; --track: #263241;
    --c-food: #d95926; --c-drink: #c98500; --c-travel: #3987e5; --c-shopping: #d55181;
    --c-bills: #9085e9; --c-fun: #199e70; --c-health: #008300; --c-other: #898781;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0F151D; --card: #18212C; --ink: #EDF1F5; --ink-2: #B4BECB; --muted: #808B99;
  --line: #263241; --key: #1C2633; --key-press: #2A3644;
  --green-ink: #2BD877; --green-wash: #12301F; --warn: #F0B232; --warn-wash: #33290F;
  --crit: #EF6B6B; --crit-wash: #3A1A1A; --bar: #3987e5; --track: #263241;
  --c-food: #d95926; --c-drink: #c98500; --c-travel: #3987e5; --c-shopping: #d55181;
  --c-bills: #9085e9; --c-fun: #199e70; --c-health: #008300; --c-other: #898781;
}

/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink); font-family: var(--ui);
  font-size: 15px; line-height: 1.5; min-height: 100dvh;
  padding-bottom: calc(68px + var(--safe-b));
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--bar); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 10px; padding: 14px 0 6px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--track); object-fit: cover; flex: none;
  display: grid; place-items: center; font-size: 16px; overflow: hidden; }
.hello { flex: 1; min-width: 0; }
.hello b { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hello span { color: var(--muted); font-size: 12px; }
.today-pill { flex: none; text-align: right; line-height: 1.25; }
.today-pill span { display: block; color: var(--muted); font-size: 11px; }
.today-pill b { font-family: var(--num); font-weight: 600; font-size: 17px; }
.today-pill.bump b { animation: bump .5s ease; }
@keyframes bump { 40% { color: var(--green-ink); transform: translateY(-2px); } }

/* ---------- add view ---------- */
.dates { display: flex; gap: 8px; margin: 10px 0 4px; }
.chip { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--card); color: var(--ink-2);
  font-size: 14px; box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); box-shadow: none; }
.date-input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

.amount { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 18px 0 2px; min-height: 76px; }
.amount .cur { font-family: var(--num); font-size: 28px; font-weight: 500; color: var(--green-ink); }
.amount .val { font-family: var(--num); font-weight: 600; font-size: 60px; line-height: 1.15; letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums; }
.amount .val.empty { color: var(--line); }
.amount .val.long { font-size: 46px; }
.note { display: block; width: 100%; text-align: center; border: 0; background: transparent; padding: 6px 0 10px;
  color: var(--ink-2); font-size: 14px; border-bottom: 1px dashed var(--line); outline: none; }
.note::placeholder { color: var(--muted); }
.note:focus { border-bottom-color: var(--ink-2); }

.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0 14px; }
.cat { --c: var(--c-other); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 7px;
  border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); transition: background .15s; }
.cat .e { font-size: 22px; line-height: 1.2; }
.cat .l { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.cat[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--c); background: color-mix(in srgb, var(--c) 12%, var(--card)); }
.cat[aria-pressed="true"] .l { color: var(--ink); font-weight: 600; }

.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { height: 50px; border-radius: 12px; background: var(--key); font-family: var(--num); font-size: 24px; font-weight: 500;
  box-shadow: 0 1px 0 var(--line); user-select: none; }
.key:active { background: var(--key-press); }
.key svg { width: 24px; height: 24px; vertical-align: middle; }

.save { display: block; width: 100%; height: 52px; margin: 12px 0 8px; border-radius: 14px; background: var(--green);
  color: #fff; font-weight: 600; font-size: 16px; transition: opacity .15s;
  position: sticky; bottom: calc(68px + var(--safe-b)); z-index: 2; box-shadow: 0 0 0 8px var(--page); }
/* จอเตี้ย (เช่น iPhone ในแอป LINE): บีบระยะให้ปุ่มบันทึกอยู่ในจอโดยไม่ต้องเลื่อน */
@media (max-height: 860px) {
  .top { padding-top: 10px; }
  .dates { margin-top: 6px; }
  .amount { margin: 8px 0 0; min-height: 62px; }
  .amount .val { font-size: 50px; }
  .amount .val.long { font-size: 40px; }
  .note { padding: 4px 0 8px; }
  .cats { margin: 12px 0 10px; gap: 6px; }
  .cat { padding: 6px 2px 5px; }
  .cat .e { font-size: 20px; }
  .keys { gap: 6px; }
  .key { height: 44px; font-size: 22px; }
  .save { height: 48px; margin-top: 10px; }
}
.save:disabled { background: var(--track); color: var(--muted); cursor: default; }

/* ---------- summary view ---------- */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
.month-nav h1 { font-size: 18px; font-weight: 600; margin: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.icon-btn svg { width: 22px; height: 22px; }

.spend { background: var(--card); border-radius: 20px; padding: 18px 18px 16px; }
.spend .lbl { color: var(--muted); font-size: 13px; }
.spend .big { font-family: var(--num); font-weight: 600; font-size: 44px; line-height: 1.1; margin: 2px 0 12px; }
.spend .big small { font-size: 24px; font-weight: 500; margin-right: 4px; color: var(--ink-2); }
.meter { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 5px; background: var(--green); transition: width .4s ease; }
.meter.warn i { background: var(--warn); }
.meter.crit i { background: var(--crit); }
.meter-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.meter-row b { font-family: var(--num); font-weight: 600; color: var(--ink); }
.link { color: var(--green-ink); font-weight: 500; }
.status { display: flex; gap: 6px; align-items: center; margin-top: 10px; padding: 7px 10px; border-radius: 10px; font-size: 13px; }
.status.warn { background: var(--warn-wash); color: var(--warn); }
.status.crit { background: var(--crit-wash); color: var(--crit); }
.status svg { width: 16px; height: 16px; flex: none; }
.facts { display: flex; gap: 20px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.facts div { font-size: 12px; color: var(--muted); }
.facts b { display: block; font-family: var(--num); font-weight: 600; font-size: 17px; color: var(--ink); }

h2 { font-size: 15px; font-weight: 600; margin: 26px 0 10px; }
.rank { list-style: none; margin: 0; padding: 0; }
.rank li { --c: var(--c-other); display: grid; grid-template-columns: 26px 1fr auto; column-gap: 10px; row-gap: 5px;
  align-items: center; padding: 8px 0; }
.rank .e { grid-row: span 2; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 15px;
  background: color-mix(in srgb, var(--c) 16%, transparent); }
.rank .n { font-size: 14px; }
.rank .n span { color: var(--muted); font-size: 12px; margin-left: 6px; }
.rank .a { font-family: var(--num); font-weight: 600; font-size: 15px; text-align: right; }
.rank .b { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.rank .b i { display: block; height: 100%; border-radius: 3px; background: var(--c); }

.chart { position: relative; background: var(--card); border-radius: 16px; padding: 12px 12px 8px; }
.chart svg { display: block; width: 100%; height: 150px; overflow: visible; touch-action: pan-y; }
.chart .bar { fill: var(--bar); }
.chart .bar.on { fill: var(--ink); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line); stroke-width: 1; }
.chart .avg { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.chart text { font-family: var(--ui); font-size: 10px; fill: var(--muted); }
.chart text.avg-l { fill: var(--ink-2); }
.tip { position: absolute; top: 4px; transform: translateX(-50%); background: var(--ink); color: var(--card); font-size: 12px;
  padding: 4px 8px; border-radius: 8px; white-space: nowrap; pointer-events: none; }
.tip b { font-family: var(--num); font-weight: 600; }

.day { margin-top: 6px; }
.day-h { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; padding: 12px 0 4px; }
.day-h b { font-family: var(--num); font-weight: 500; }
.entry { --c: var(--c-other); display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0;
  border-bottom: 1px solid var(--line); }
.entry .e { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; flex: none;
  background: color-mix(in srgb, var(--c) 16%, transparent); }
.entry .t { flex: 1; min-width: 0; }
.entry .t b { display: block; font-weight: 500; font-size: 14px; }
.entry .t span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .a { font-family: var(--num); font-weight: 600; font-size: 16px; }

.empty { text-align: center; padding: 36px 12px; color: var(--ink-2); }
.empty .e { font-size: 40px; }
.empty p { margin: 8px 0 16px; }
.btn { height: 44px; padding: 0 20px; border-radius: 12px; background: var(--green); color: #fff; font-weight: 600; }
.btn.ghost { background: var(--track); color: var(--ink); }
.btn.danger { background: var(--crit); color: #fff; }

.skel { height: 14px; border-radius: 7px; background: var(--track); margin: 10px 0; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }

/* ---------- nav ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b); z-index: 5; }
.nav .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
.nav button { height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; color: var(--muted); }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--green-ink); font-weight: 600; }

/* ---------- sheet & toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 24, .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--card); border-radius: 20px 20px 0 0;
  padding: 20px 20px calc(20px + var(--safe-b)); transform: translateY(105%); transition: transform .25s ease; max-width: 480px; margin: 0 auto;
  max-height: 90dvh; overflow-y: auto; overscroll-behavior: contain; }
.open .scrim { opacity: 1; pointer-events: auto; }
.open .sheet { transform: none; }
.sheet h3 { margin: 0 0 4px; font-size: 17px; }
.sheet p { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; }
.sheet .row { display: flex; gap: 10px; margin-top: 16px; }
.sheet .row .btn { flex: 1; }
.field { display: flex; align-items: center; gap: 6px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); padding: 0 14px; }
.field span { font-family: var(--num); font-size: 22px; color: var(--muted); }
.field input { flex: 1; border: 0; background: transparent; outline: none; height: 54px; font-family: var(--num); font-size: 26px; font-weight: 600; min-width: 0; }
.field:focus-within { box-shadow: inset 0 0 0 2px var(--green); }

.toast { position: fixed; left: 50%; bottom: calc(80px + var(--safe-b)); transform: translate(-50%, 12px); opacity: 0;
  background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20;
  transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--crit); color: #fff; }

.fatal { padding: 60px 24px; text-align: center; color: var(--ink-2); }
.fatal b { display: block; font-size: 17px; color: var(--ink); margin-bottom: 6px; }
.demo-tag { font-size: 11px; color: var(--warn); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="avatar" id="avatar">🙂</div>
    <div class="hello"><b id="hello">สวัสดีค่ะ</b><span id="sub">วันนี้ใช้อะไรไปบ้างคะ</span></div>
    <div class="today-pill" id="todayPill"><span>วันนี้</span><b class="num" id="todayTotal">฿0</b></div>
  </header>

  <main id="viewAdd">
    <div class="dates" role="group" aria-label="วันที่ของรายการ">
      <button class="chip" data-date="today" aria-pressed="true">วันนี้</button>
      <button class="chip" data-date="yesterday" aria-pressed="false">เมื่อวาน</button>
      <button class="chip" data-date="pick" aria-pressed="false" id="pickChip">เลือกวัน</button>
      <input type="date" class="date-input" id="dateInput" aria-label="เลือกวันที่">
    </div>

    <div class="amount" aria-live="polite">
      <span class="cur">฿</span><span class="val empty" id="amountVal">0</span>
    </div>
    <input class="note" id="note" maxlength="100" placeholder="จดสั้น ๆ ว่าซื้ออะไร (ไม่ใส่ก็ได้ค่ะ)" autocomplete="off">

    <div class="cats" id="cats" role="group" aria-label="หมวดหมู่"></div>

    <div class="keys" id="keys">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key" data-k=".">.</button><button class="key" data-k="0">0</button>
      <button class="key" data-k="del" aria-label="ลบตัวเลข">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m12.5 9.5 5 5m0-5-5 5"/></svg>
      </button>
    </div>
    <button class="save" id="save" disabled>ใส่จำนวนเงินก่อนนะคะ</button>
  </main>

  <main id="viewSum" hidden>
    <div class="month-nav">
      <button class="icon-btn" id="prevM" aria-label="เดือนก่อน">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <h1 id="monthTitle">เดือนนี้</h1>
      <button class="icon-btn" id="nextM" aria-label="เดือนถัดไป">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
    <div id="sumBody"></div>
  </main>

</div>

<nav class="nav" aria-label="เมนู">
  <div class="in">
    <button id="tabAdd" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      จดรายจ่าย
    </button>
    <button id="tabSum">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10m6 10V4m6 16v-7m4 7H3"/></svg>
      สรุปรายเดือน
    </button>
  </div>
</nav>

<div id="sheetWrap">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   ตั้งค่า 2 บรรทัดนี้ให้ตรงกับของคุณ
   ===================================================================== */
const LIFF_ID = '2011992127-ggD39O1P';
const API_URL = 'https://script.google.com/macros/s/AKfycbwWsheicaHrrVdB_cON9QHeDY21pQGzbAspOyrqLKsKVPcmFHIhUhkgRICMq6uLUnhI/exec';

/* เปิดด้วย ?demo=1 ท้าย URL เพื่อดูหน้าตาด้วยข้อมูลตัวอย่าง (ไม่ต้องต่อ LINE) */
const DEMO = new URLSearchParams(location.search).has('demo');

const CATS = [
  { key: 'food', label: 'อาหาร', emoji: '🍜' },
  { key: 'drink', label: 'เครื่องดื่ม', emoji: '🧋' },
  { key: 'travel', label: 'เดินทาง', emoji: '🚕' },
  { key: 'shopping', label: 'ช้อปปิ้ง', emoji: '🛍️' },
  { key: 'bills', label: 'บ้านและบิล', emoji: '🏠' },
  { key: 'fun', label: 'บันเทิง', emoji: '🎬' },
  { key: 'health', label: 'สุขภาพ', emoji: '💊' },
  { key: 'other', label: 'อื่น ๆ', emoji: '📦' },
];
const CAT = Object.fromEntries(CATS.map(c => [c.key, c]));
const MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const WD = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayIso = () => isoOf(new Date());
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return isoOf(new Date(y, m - 1, d + n)); };
const parseIso = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const nf = new Intl.NumberFormat('th-TH', { maximumFractionDigits: 2 });
const baht = n => '฿' + nf.format(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shortDate = iso => { const d = parseIso(iso); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const monthTitle = ym => { const [y, m] = ym.split('-').map(Number); return MONTHS[m - 1] + ' ' + (y + 543); };
const shiftMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };

const S = {
  view: 'add', amount: '', cat: null, date: todayIso(), dateMode: 'today',
  month: todayIso().slice(0, 7), data: {}, busy: false,
};

/* ---------------- API ---------------- */
async function api(action, payload = {}) {
  if (DEMO) return demoApi(action, payload);
  const res = await fetch(API_URL, {
    method: 'POST',   // ไม่ใส่ Content-Type → ส่งเป็น text/plain เพื่อให้ Apps Script รับได้โดยไม่ติด CORS
    body: JSON.stringify(Object.assign({ action, idToken: liff.getIDToken() }, payload)),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'ERROR');
  return j.data;
}

function errMsg(e) {
  const m = (e && e.message) || '';
  if (m === 'TOKEN_INVALID' || m === 'NO_TOKEN') return 'เซสชันหมดอายุค่ะ ปิดหน้านี้แล้วเปิดใหม่อีกครั้งนะคะ';
  if (m === 'BAD_AMOUNT') return 'จำนวนเงินไม่ถูกต้องค่ะ';
  if (m === 'NOT_FOUND') return 'ไม่พบรายการนี้แล้วค่ะ อาจถูกลบไปก่อนหน้า';
  if (m === 'Failed to fetch' || m.includes('JSON')) return 'เชื่อมต่อไม่ได้ค่ะ ลองใหม่อีกครั้งนะคะ';
  return 'มีบางอย่างผิดพลาดค่ะ (' + m + ')';
}

function store(data) { S.data[data.month] = { budget: data.budget, items: data.items }; }

async function loadMonth(ym) {
  try { store(await api('month', { month: ym })); }
  catch (e) { toast(errMsg(e), true); }
  render();
}

/* ---------------- add view ---------------- */
function buildCats() {
  $('cats').innerHTML = CATS.map(c =>
    `<button class="cat" data-cat="${c.key}" style="--c: var(--c-${c.key})" aria-pressed="false">
       <span class="e" aria-hidden="true">${c.emoji}</span><span class="l">${c.label}</span></button>`).join('');
}

function press(k) {
  let a = S.amount;
  if (k === 'del') a = a.slice(0, -1);
  else if (k === '.') { if (!a.includes('.')) a = (a || '0') + '.'; }
  else {
    if (a === '0') a = '';
    const [i, d] = a.split('.');
    if (d !== undefined) { if (d.length >= 2) return; }
    else if ((i || '').length >= 7) return;
    a += k;
  }
  S.amount = a;
  renderAdd();
}

function typed(a) {
  if (!a) return '0';
  const [i, d] = a.split('.');
  const ii = nf.format(Number(i || 0));
  return d !== undefined ? ii + '.' + d : ii;
}

function setDateMode(mode, iso) {
  S.dateMode = mode;
  S.date = mode === 'today' ? todayIso() : mode === 'yesterday' ? addDays(todayIso(), -1) : iso;
  renderAdd();
}

function renderAdd() {
  const v = $('amountVal');
  v.textContent = typed(S.amount);
  v.classList.toggle('empty', !S.amount);
  v.classList.toggle('long', v.textContent.length > 8);

  document.querySelectorAll('.chip[data-date]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.date === (S.dateMode === 'pick' ? 'pick' : S.dateMode))));
  $('pickChip').textContent = S.dateMode === 'pick' ? shortDate(S.date) : 'เลือกวัน';

  document.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === S.cat)));

  const amount = Number(S.amount);
  const btn = $('save');
  if (S.busy) { btn.disabled = true; btn.textContent = 'กำลังบันทึก…'; return; }
  btn.disabled = !(amount > 0 && S.cat);
  btn.textContent = !(amount > 0) ? 'ใส่จำนวนเงินก่อนนะคะ'
    : !S.cat ? 'เลือกหมวดก่อนนะคะ'
    : 'บันทึก ' + baht(amount) + ' (' + CAT[S.cat].label + ')';
}

async function save() {
  const amount = Number(S.amount);
  if (!(amount > 0) || !S.cat || S.busy) return;
  S.busy = true; renderAdd();
  try {
    const data = await api('add', {
      month: S.date.slice(0, 7),
      expense: { date: S.date, amount, category: S.cat, note: $('note').value.trim() },
    });
    store(data);
    toast('บันทึก ' + baht(amount) + ' (' + CAT[S.cat].label + ') แล้วค่ะ');
    S.amount = ''; S.cat = null; $('note').value = '';
    const pill = $('todayPill'); pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
  } catch (e) {
    toast(errMsg(e), true);
  } finally {
    S.busy = false;
    render();
  }
}

/* ---------------- header ---------------- */
function renderHeader() {
  const cur = S.data[todayIso().slice(0, 7)];
  const t = todayIso();
  const sum = cur ? cur.items.filter(i => i.date === t).reduce((s, i) => s + i.amount, 0) : 0;
  $('todayTotal').textContent = baht(sum);
}

/* ---------------- summary view ---------------- */
function renderSum() {
  $('monthTitle').textContent = monthTitle(S.month);
  const curMonth = todayIso().slice(0, 7);
  $('nextM').disabled = S.month >= curMonth;

  const st = S.data[S.month];
  const body = $('sumBody');
  if (!st) {
    body.innerHTML = '<div class="spend"><div class="skel" style="width:30%"></div><div class="skel" style="height:40px;width:60%"></div><div class="skel"></div></div>';
    return;
  }

  const items = st.items;
  const total = items.reduce((s, i) => s + i.amount, 0);
  const [y, m] = S.month.split('-').map(Number);
  const daysIn = new Date(y, m, 0).getDate();
  const elapsed = S.month === curMonth ? new Date().getDate() : S.month < curMonth ? daysIn : 0;
  const avg = elapsed ? total / elapsed : 0;

  let html = '<section class="spend"><div class="lbl">ใช้ไปแล้ว</div>' +
    `<div class="big"><small>฿</small>${nf.format(total)}</div>`;

  if (st.budget) {
    const r = total / st.budget;
    const lvl = r >= 1 ? 'crit' : r >= 0.8 ? 'warn' : '';
    html += `<div class="meter ${lvl}" role="meter" aria-valuemin="0" aria-valuemax="${st.budget}" aria-valuenow="${total}" aria-label="ใช้ไป ${Math.round(r * 100)}% ของงบ">
               <i style="width:${Math.min(100, r * 100).toFixed(1)}%"></i></div>
             <div class="meter-row">
               <span>${r < 1 ? 'เหลือ <b>' + baht(st.budget - total) + '</b>' : 'ใช้ไป <b>' + Math.round(r * 100) + '%</b> ของงบ'}</span>
               <button class="link" id="editBudget">งบ ${baht(st.budget)}</button>
             </div>`;
    if (lvl === 'warn') html += `<div class="status warn">${ICON_WARN}<span>ใช้ไป ${Math.round(r * 100)}% ของงบแล้ว ใกล้เต็มแล้วนะคะ</span></div>`;
    if (lvl === 'crit') html += `<div class="status crit">${ICON_WARN}<span>เกินงบมา ${baht(total - st.budget)} แล้วค่ะ</span></div>`;
  } else {
    html += `<div class="meter-row" style="margin-top:0"><span>ยังไม่ได้ตั้งงบเดือนนี้</span><button class="link" id="editBudget">ตั้งงบ</button></div>`;
  }

  if (items.length) {
    html += `<div class="facts">
      <div><b>${items.length}</b>รายการ</div>
      ${avg ? `<div><b>${baht(Math.round(avg))}</b>เฉลี่ยต่อวัน</div>` : ''}
      ${st.budget && S.month === curMonth && total < st.budget
        ? `<div><b>${baht(Math.floor((st.budget - total) / (daysIn - elapsed + 1)))}</b>ใช้ได้ต่อวันจากนี้</div>` : ''}
    </div>`;
  }
  html += '</section>';

  if (!items.length) {
    html += `<div class="empty"><div class="e">🧾</div><p>${S.month === curMonth ? 'เดือนนี้ยังไม่มีรายการเลยค่ะ' : 'เดือนนี้ไม่มีรายการค่ะ'}</p>
             ${S.month === curMonth ? '<button class="btn" id="goAdd">จดรายจ่ายแรก</button>' : ''}</div>`;
    body.innerHTML = html;
    bindSum();
    return;
  }

  // ใช้ไปกับอะไรบ้าง (เรียงจากมากไปน้อย — สีตามหมวดเสมอ)
  const byCat = {};
  items.forEach(i => { byCat[i.category] = (byCat[i.category] || 0) + i.amount; });
  const ranked = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);
  const top = byCat[ranked[0]];
  html += '<h2>ใช้ไปกับอะไรบ้าง</h2><ul class="rank">' + ranked.map(k => {
    const c = CAT[k] || CAT.other;
    return `<li style="--c: var(--c-${c.key})"><span class="e" aria-hidden="true">${c.emoji}</span>
      <span class="n">${c.label}<span>${Math.round(byCat[k] / total * 100)}%</span></span>
      <span class="a">${baht(byCat[k])}</span>
      <span class="b"><i style="width:${(byCat[k] / top * 100).toFixed(1)}%"></i></span></li>`;
  }).join('') + '</ul>';

  html += '<h2>รายวัน</h2><div class="chart" id="chart"><div class="tip" id="tip" hidden></div></div>';

  // รายการ แยกตามวัน
  html += '<h2>รายการทั้งหมด</h2>';
  const days = {};
  items.forEach(i => { (days[i.date] = days[i.date] || []).push(i); });
  Object.keys(days).sort().reverse().forEach(d => {
    const list = days[d];
    const t = todayIso();
    const label = d === t ? 'วันนี้' : d === addDays(t, -1) ? 'เมื่อวาน' : shortDate(d);
    html += `<div class="day"><div class="day-h"><span>${label}</span><b>${baht(list.reduce((s, i) => s + i.amount, 0))}</b></div>` +
      list.map(i => {
        const c = CAT[i.category] || CAT.other;
        return `<button class="entry" data-id="${esc(i.id)}" style="--c: var(--c-${c.key})">
          <span class="e" aria-hidden="true">${c.emoji}</span>
          <span class="t"><b>${c.label}</b>${i.note ? `<span>${esc(i.note)}</span>` : ''}</span>
          <span class="a">${baht(i.amount)}</span></button>`;
      }).join('') + '</div>';
  });

  body.innerHTML = html;
  drawChart(items, daysIn, elapsed, avg);
  bindSum();
}

const ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4m0 3v.01"/></svg>';

function bindSum() {
  const eb = $('editBudget'); if (eb) eb.onclick = openBudget;
  const ga = $('goAdd'); if (ga) ga.onclick = () => go('add');
  document.querySelectorAll('.entry').forEach(b => b.onclick = () => openDelete(b.dataset.id));
}

/* ---------- กราฟรายวัน (SVG) ---------- */
function niceMax(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v) return k * p;
  return 10 * p;
}

function drawChart(items, daysIn, elapsed, avg) {
  const box = $('chart');
  const daily = Array(daysIn).fill(0);
  items.forEach(i => { daily[Number(i.date.slice(8)) - 1] += i.amount; });

  const W = Math.max(240, box.clientWidth - 24), H = 150, top = 18, bottom = 20;
  const max = niceMax(Math.max(...daily, 1));
  const step = W / daysIn, bw = Math.max(3, Math.min(14, step - 3));
  const yOf = v => H - bottom - v / max * (H - top - bottom);

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟรายจ่ายรายวัน สูงสุดวันละ ${baht(Math.max(...daily))}">`;
  s += `<line class="grid" x1="0" x2="${W}" y1="${top}" y2="${top}"/><text x="0" y="${top - 5}">${baht(max)}</text>`;
  s += `<line class="base" x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}"/>`;

  daily.forEach((v, i) => {
    if (v <= 0) return;
    const x = i * step + (step - bw) / 2, y = yOf(v), h = H - bottom - y, r = Math.min(3, bw / 2, h);
    s += `<path class="bar" data-i="${i}" d="M${x},${H - bottom} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${H - bottom} Z"/>`;
  });

  if (avg > 0) {
    const ya = yOf(avg);
    s += `<line class="avg" x1="0" x2="${W}" y1="${ya}" y2="${ya}"/>`;
    s += `<text class="avg-l" x="${W}" y="${ya - 4}" text-anchor="end">เฉลี่ย ${baht(Math.round(avg))}</text>`;
  }
  [1, 8, 15, 22, 29].filter(d => d <= daysIn).forEach(d => {
    s += `<text x="${(d - 0.5) * step}" y="${H - 4}" text-anchor="middle">${d}</text>`;
  });
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="hit"/>`;
  s += '</svg>';
  box.insertAdjacentHTML('beforeend', s);

  const svg = box.querySelector('svg'), tip = $('tip');
  const [y, m] = S.month.split('-').map(Number);
  const show = ev => {
    const rect = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(daysIn - 1, Math.floor((ev.clientX - rect.left) / rect.width * daysIn)));
    svg.querySelectorAll('.bar').forEach(b => b.classList.toggle('on', Number(b.dataset.i) === i));
    const d = new Date(y, m - 1, i + 1);
    tip.innerHTML = `${WD[d.getDay()]} ${i + 1} ${MON[m - 1]}  <b>${baht(daily[i])}</b>`;
    tip.hidden = false;
    const x = (i + 0.5) / daysIn * rect.width + 12;
    tip.style.left = Math.max(60, Math.min(box.clientWidth - 60, x)) + 'px';
  };
  const hide = () => { tip.hidden = true; svg.querySelectorAll('.bar.on').forEach(b => b.classList.remove('on')); };
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointermove', ev => { if (ev.pointerType === 'mouse' || ev.buttons) show(ev); });
  svg.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') hide(); });
  document.addEventListener('pointerdown', ev => { if (!box.contains(ev.target)) hide(); }, { once: true });
}

/* ---------- งบ / ลบ (bottom sheet) ---------- */
function openSheet(html) { $('toast').classList.remove('show'); $('sheet').innerHTML = html; $('sheetWrap').classList.add('open'); }
function closeSheet() { $('sheetWrap').classList.remove('open'); }

function openBudget() {
  const st = S.data[S.month];
  openSheet(`<h3>งบรายจ่ายต่อเดือน</h3>
    <p>เลขาจะทักเตือนเมื่อใช้ไปถึง 80% และเมื่อเกินงบค่ะ</p>
    <label class="field"><span>฿</span><input id="budgetIn" type="number" inputmode="numeric" min="0" step="100"
      value="${st && st.budget ? st.budget : ''}" placeholder="เช่น 10000" aria-label="งบต่อเดือน"></label>
    <div class="row"><button class="btn ghost" id="cancel">ยกเลิก</button><button class="btn" id="okBudget">บันทึกงบ</button></div>`);
  setTimeout(() => $('budgetIn').focus(), 250);
  $('cancel').onclick = closeSheet;
  $('okBudget').onclick = async () => {
    const v = Math.round(Number($('budgetIn').value) || 0);
    if (v < 0) return;
    $('okBudget').disabled = true;
    try {
      store(await api('budget', { month: S.month, budget: v }));
      closeSheet(); toast(v ? 'ตั้งงบ ' + baht(v) + ' แล้วค่ะ' : 'ยกเลิกงบแล้วค่ะ'); render();
    } catch (e) { toast(errMsg(e), true); $('okBudget').disabled = false; }
  };
}

function openDelete(id) {
  const st = S.data[S.month];
  const it = st && st.items.find(i => i.id === id);
  if (!it) return;
  const c = CAT[it.category] || CAT.other;
  openSheet(`<h3>ลบรายการนี้ไหมคะ?</h3>
    <p>${c.emoji} ${c.label} ${baht(it.amount)} · ${shortDate(it.date)}${it.note ? '<br>' + esc(it.note) : ''}</p>
    <div class="row"><button class="btn ghost" id="cancel">ไม่ลบ</button><button class="btn danger" id="okDel">ลบรายการ</button></div>`);
  $('cancel').onclick = closeSheet;
  $('okDel').onclick = async () => {
    $('okDel').disabled = true;
    try {
      store(await api('delete', { month: S.month, id }));
      closeSheet(); toast('ลบรายการแล้วค่ะ'); render();
    } catch (e) { toast(errMsg(e), true); $('okDel').disabled = false; }
  };
}

/* ---------------- shell ---------------- */
let toastTimer;
function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), err ? 4000 : 2200);
}

const VIEWS = { add: ['viewAdd', 'tabAdd'], sum: ['viewSum', 'tabSum'] };

function go(view) {
  S.view = view;
  Object.keys(VIEWS).forEach(k => {
    $(VIEWS[k][0]).hidden = k !== view;
    if (k === view) $(VIEWS[k][1]).setAttribute('aria-current', 'page');
    else $(VIEWS[k][1]).removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
  render();
}

function render() {
  renderHeader();
  if (S.view === 'add') renderAdd(); else renderSum();
}

function bind() {
  buildCats();
  $('keys').addEventListener('click', e => { const k = e.target.closest('.key'); if (k) press(k.dataset.k); });
  $('cats').addEventListener('click', e => {
    const b = e.target.closest('.cat'); if (!b) return;
    S.cat = S.cat === b.dataset.cat ? null : b.dataset.cat; renderAdd();
  });
  document.querySelectorAll('.chip[data-date]').forEach(b => b.onclick = () => {
    if (b.dataset.date !== 'pick') return setDateMode(b.dataset.date);
    const inp = $('dateInput');
    inp.max = todayIso(); inp.value = S.date;
    if (inp.showPicker) { try { inp.showPicker(); return; } catch (_) {} }
    inp.click();
  });
  $('dateInput').addEventListener('change', e => { if (e.target.value) setDateMode('pick', e.target.value); });
  $('save').onclick = save;
  $('tabAdd').onclick = () => go('add');
  $('tabSum').onclick = () => go('sum');
  $('prevM').onclick = () => { S.month = shiftMonth(S.month, -1); if (!S.data[S.month]) loadMonth(S.month); render(); };
  $('nextM').onclick = () => { S.month = shiftMonth(S.month, 1); if (!S.data[S.month]) loadMonth(S.month); render(); };
  $('scrim').onclick = closeSheet;

  // พิมพ์ตัวเลขจากคีย์บอร์ดได้ (LINE บนคอม)
  document.addEventListener('keydown', e => {
    if (S.view !== 'add' || document.activeElement === $('note') || $('sheetWrap').classList.contains('open')) {
      if (e.key === 'Escape') closeSheet();
      return;
    }
    if (/^[0-9.]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
    else if (e.key === 'Enter') save();
  });
}

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('โหลด LIFF SDK ไม่ได้'));
    document.head.appendChild(s);
  });
}

function fatal(title, detail) {
  document.body.innerHTML = `<div class="fatal"><b>${esc(title)}</b>${esc(detail || '')}</div>`;
}

async function init() {
  bind();
  try {
    let profile;
    if (DEMO) {
      profile = { displayName: 'โหมดทดลอง' };
      $('sub').innerHTML = '<span class="demo-tag">ข้อมูลตัวอย่าง ไม่บันทึกจริงค่ะ</span>';
    } else {
      if (LIFF_ID.startsWith('ใส่') || API_URL.startsWith('ใส่')) {
        return fatal('ยังตั้งค่าไม่ครบค่ะ', 'ใส่ LIFF_ID และ API_URL ในไฟล์ index.html ก่อนนะคะ (หรือเปิดด้วย ?demo=1 เพื่อดูตัวอย่าง)');
      }
      await loadScript('https://static.line-scdn.net/liff/edge/2/sdk.js');
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      profile = await liff.getProfile();
    }
    $('hello').textContent = 'สวัสดีค่ะ คุณ' + profile.displayName;
    if (profile.pictureUrl) $('avatar').innerHTML = `<img class="avatar" src="${esc(profile.pictureUrl)}" alt="">`;
    render();
    await loadMonth(S.month);
  } catch (e) {
    fatal('เปิดสมุดรายจ่ายไม่สำเร็จค่ะ', e.message);
  }
}

/* ---------------- demo data ---------------- */
let demoDB = null;
function demoApi(action, p) {
  if (!demoDB) {
    demoDB = { budget: 12000, items: [] };
    const t = new Date(), keys = ['food', 'food', 'food', 'drink', 'drink', 'travel', 'travel', 'shopping', 'fun', 'bills', 'health'];
    const notes = { food: ['ข้าวมันไก่', 'ก๋วยเตี๋ยว', 'ข้าวกะเพรา', 'ชาบู'], drink: ['ชาไข่มุก', 'กาแฟเย็น'], travel: ['BTS', 'Grab'],
      shopping: ['เสื้อยืด'], fun: ['ดูหนัง'], bills: ['ค่าไฟ'], health: ['วิตามิน'] };
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let back = 0; back < 75; back++) {
      const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - back);
      const n = 1 + Math.floor(rnd() * 3);
      for (let j = 0; j < n; j++) {
        const k = keys[Math.floor(rnd() * keys.length)];
        const base = { food: 80, drink: 55, travel: 60, shopping: 450, fun: 240, bills: 900, health: 300 }[k];
        demoDB.items.push({ id: 'd' + back + j, date: isoOf(d), category: k, amount: Math.round(base * (0.6 + rnd())),
          note: notes[k][Math.floor(rnd() * notes[k].length)] });
      }
    }
  }
  if (action === 'add') demoDB.items.push(Object.assign({ id: 'n' + Date.now() }, p.expense));
  if (action === 'delete') demoDB.items = demoDB.items.filter(i => i.id !== p.id);
  if (action === 'budget') demoDB.budget = p.budget;
  const month = action === 'add' ? p.expense.date.slice(0, 7) : p.month;
  const items = demoDB.items.filter(i => i.date.slice(0, 7) === month).sort((a, b) => b.date.localeCompare(a.date));
  return new Promise(ok => setTimeout(() => ok({ month, budget: demoDB.budget, items: JSON.parse(JSON.stringify(items)) }), 250));
}
